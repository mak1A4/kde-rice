<svg version="1.1" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
 <!-- ChatGPT's tray glyph for kde-rice, in WhiteSur's tray style: OpenAI's knot as three rounded capsules; in the colour scheme's text colour (kde-rice colours it with the theme) -->
 <defs>
  <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#363636; } .ColorScheme-NegativeText { color:#da4453; }</style>
 </defs>
 <g class="ColorScheme-Text" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <rect x="11.5" y="5" width="9" height="22" rx="4.5" transform="rotate(0 16 16)"/>
  <rect x="11.5" y="5" width="9" height="22" rx="4.5" transform="rotate(60 16 16)"/>
  <rect x="11.5" y="5" width="9" height="22" rx="4.5" transform="rotate(120 16 16)"/>
 </g>
</svg>

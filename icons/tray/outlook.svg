 </defs>
 <g class="ColorScheme-Text" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4.5" y="8" width="23" height="16" rx="3"/>
  <path d="m5.5 10 10.5 7.5 10.5-7.5"/>
 </g>

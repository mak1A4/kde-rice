<svg version="1.1" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
 <!-- Outlook's tray glyph for kde-rice, in WhiteSur's tray style: an envelope; in the colour scheme's text colour (kde-rice colours it with the theme) -->
